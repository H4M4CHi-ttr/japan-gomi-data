handle: yonago
name_ja: 米子市
region_ja: 鳥取県
code: '31202'
source:
  index_url: https://www.city.yonago.lg.jp/1139.htm
  schedule_url: https://www.city.yonago.lg.jp/item/60812.htm
  yearend_url: https://www.city.yonago.lg.jp/item/60812.htm
notes:
  - 令和8年度公式カレンダー（掲載日2026-02-26）の2026-04-01〜2027-03-31のみ。取得日2026-10-13。24 PDFで30地区を収録し、公式町名表157行を町丁目単位に展開。地区対応はcoverage.md、通常曜日表との相違日はexceptions.md、全PDFのURLとSHA-256はsources.jsonに記録する。
  - 米子地区と旧淀江町区域を同じ規則にしない。淀江・西原・宇田川・大和の白色発泡スチロール・トレーは独立した第2・4金曜日の収集。大和の可燃ごみは水・土曜日。実際の日付は地区別PDFを正典とし、HTML表の通常規則から推測しない。
  - 可燃ごみは祝日でも収集する例がある一方、資源・不燃の休止や別日の収集は品目別。啓成の2026-05-04は可燃だけ、2027-01-05はペットボトル、2027-01-12は缶・ビン・発泡スチロール。全種別を一括で休止・振替にしない。年末年始の欠けも24カレンダーの実日付セルから抽出する。
  - 電池類・蛍光管等は2026-06-06、2026-09-05、2026-12-05、2027-03-06。2026年6月からリチウムイオン充電池類を含む。根拠はPDFの各日付セルと表紙、公式告知 https://www.city.yonago.lg.jp/47983.htm 。hazardousはこの回収枠のみを示す。
  - plasticのラベルは白色発泡スチロール・トレーに限定し、全てのプラスチックの回収を意味しない。oversizedは不燃性粗大ごみのみ。缶・ビン類はbeverage_canとglass_bottleに分解する。いずれも既存の正典語彙で表す。混合粗大ごみ・持込み・予約回収・古布の独立回収は収録していない。
  - 町名が複数地区にまたがる場合は地区名つき候補を残す。市の公開一覧で番地境界を確定できないため、住所だけで地区を推測せず確認が必要な旨をarea.noteへ記録する。239町丁目を259候補として扱う。公式一覧にない区域への割当は作成しない。
  - 出典・帰属は米子市発行「令和8年度ごみ分別収集カレンダー」と「町名別ごみ収集地区一覧」。日付・種別・地域対応の事実をCodexが抽出・独自形式へ整理したもので、市による作成・推奨を意味しない。
  - 元資料の権利条件は https://www.city.yonago.lg.jp/1085.htm で確認。文書・画像等の権利は原則市に帰属し、資料の使用は担当課への相談を案内する。オープンライセンスの表示・個別許諾は確認していない。市のPDF・図版・広告・説明文を転載せず事実のみを抽出する。リポジトリの独自整理データのCC BY 4.0を市の元資料のライセンスとして表示しない。分別辞典は未収録。
  - 読みと町字IDはデジタル庁アドレス・ベース・レジストリ（鳥取県フルセット、https://data.address-br.digital.go.jp/mt_town_fullset/pref/mt_town_fullset_pref31.csv.zip 、政府標準利用規約）を利用。IDが一意に対応しない公式町名はIDを付けない。
  - ABRにある日ノ出町・米原の丁目なし町字とみのり町は公式収集町名表に直接現れず、地区を推測して付けていない（日ノ出町・米原の丁目別行は収録済み）。皆生の丁目なし行と蚊屋はABRのIDが一意に対応せず、公式町名表の読みだけを残した。
  - 検証は24×365=8760日枠・6504種別イベントの抽出・再展開の完全一致、全日付・重複・地域・正典種別・年度境界、通常HTML規則との203相違日確認、PDF画像の目視218日枠、日付の欠落・追加2方向の改竄検査。独立した公式の全実日付ソースは未確認。HTML表は独立した曜日表現だが祝日・年末年始の例外はPDFにしかない。
  - 確率的信頼度は等級②（通常曜日の独立表現との比較）と③（PDF実日付の自己照合）。8760日枠を独立試行と数えない。目視はリスク箇所の選択サンプルのためrule of threeによる無作為母集団の誤り率を主張しない。元の市資料の共通原因誤りと未目視セルの残余リスクがある。
